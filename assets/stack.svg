<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Sarshij's Tech Stack">
<defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
    .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
  </style>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0d0b16"/>
    <stop offset="100%" stop-color="#12102a"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#8A2BE2"/>
    <stop offset="100%" stop-color="#19e3e6"/>
  </linearGradient>
  <linearGradient id="bar1" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#8A2BE2"/>
    <stop offset="100%" stop-color="#b47cff"/>
  </linearGradient>
  <linearGradient id="bar2" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#19e3e6"/>
    <stop offset="100%" stop-color="#19e3e6" stop-opacity="0.5"/>
  </linearGradient>
  <linearGradient id="bar3" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#e643c8"/>
    <stop offset="100%" stop-color="#e643c8" stop-opacity="0.5"/>
  </linearGradient>
  <linearGradient id="bar4" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#43e68d"/>
    <stop offset="100%" stop-color="#43e68d" stop-opacity="0.5"/>
  </linearGradient>
  <linearGradient id="bar5" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#e6a543"/>
    <stop offset="100%" stop-color="#e6a543" stop-opacity="0.5"/>
  </linearGradient>
  <linearGradient id="bar6" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#43a8e6"/>
    <stop offset="100%" stop-color="#43a8e6" stop-opacity="0.5"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow-strong">
    <feGaussianBlur stdDeviation="6" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="chip-clip">
    <rect x="30" y="20" width="260" height="380" rx="12"/>
  </clipPath>
</defs>

<!-- BG -->
<rect width="900" height="420" fill="url(#bg)" rx="16"/>

<!-- Scanline overlay -->
<rect width="900" height="420" fill="none" rx="16" stroke="#8A2BE2" stroke-width="1" opacity="0.4"/>

<!-- Animated scanline sweep -->
<rect x="0" y="0" width="900" height="2" fill="#8A2BE2" opacity="0.08" rx="1">
  <animateTransform attributeName="transform" type="translate" from="0 0" to="0 420" dur="4s" repeatCount="indefinite"/>
</rect>

<!-- ══════════ LEFT: CIRCUIT CHIP ══════════ -->
<g clip-path="url(#chip-clip)">
  <!-- Chip body -->
  <rect x="30" y="20" width="260" height="380" rx="12" fill="#0a0818" stroke="#8A2BE2" stroke-width="1.5"/>
  <!-- Chip inner -->
  <rect x="80" y="90" width="160" height="230" rx="6" fill="#0d0b1e" stroke="#8A2BE2" stroke-width="1" opacity="0.8"/>
  <!-- Chip label -->
  <text x="160" y="68" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" fill="#8A2BE2" letter-spacing="4" opacity="0.9">S A R S H I J</text>
  <text x="160" y="82" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="7" fill="#19e3e6" letter-spacing="2" opacity="0.6">BEI · NCE · T.U.</text>

  <!-- Chip core label -->
  <text x="160" y="185" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="13" fill="#b47cff" letter-spacing="1" font-weight="bold" filter="url(#glow)">SARSHIJ</text>
  <text x="160" y="202" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8" fill="#19e3e6" letter-spacing="2" opacity="0.7">0x8F2A</text>
  <text x="160" y="218" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="7" fill="#d9d4ee" letter-spacing="1" opacity="0.5">█▓▒░ CORE ░▒▓█</text>
  <text x="160" y="236" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="7" fill="#e643c8" letter-spacing="1" opacity="0.6">AI · SECURITY · EMBEDDED</text>

  <!-- Pin rows left -->
  <line x1="30" y1="110" x2="80" y2="110" stroke="#19e3e6" stroke-width="1.5" opacity="0.7"/>
  <line x1="30" y1="135" x2="80" y2="135" stroke="#19e3e6" stroke-width="1.5" opacity="0.7"/>
  <line x1="30" y1="160" x2="80" y2="160" stroke="#b47cff" stroke-width="1.5" opacity="0.7"/>
  <line x1="30" y1="185" x2="80" y2="185" stroke="#b47cff" stroke-width="1.5" opacity="0.7"/>
  <line x1="30" y1="210" x2="80" y2="210" stroke="#19e3e6" stroke-width="1.5" opacity="0.7"/>
  <line x1="30" y1="235" x2="80" y2="235" stroke="#19e3e6" stroke-width="1.5" opacity="0.7"/>
  <line x1="30" y1="260" x2="80" y2="260" stroke="#b47cff" stroke-width="1.5" opacity="0.7"/>
  <line x1="30" y1="285" x2="80" y2="285" stroke="#b47cff" stroke-width="1.5" opacity="0.7"/>
  <line x1="30" y1="310" x2="80" y2="310" stroke="#19e3e6" stroke-width="1.5" opacity="0.7"/>
  <!-- Pin rows right -->
  <line x1="240" y1="110" x2="290" y2="110" stroke="#e643c8" stroke-width="1.5" opacity="0.7"/>
  <line x1="240" y1="135" x2="290" y2="135" stroke="#e643c8" stroke-width="1.5" opacity="0.7"/>
  <line x1="240" y1="160" x2="290" y2="160" stroke="#43e68d" stroke-width="1.5" opacity="0.7"/>
  <line x1="240" y1="185" x2="290" y2="185" stroke="#43e68d" stroke-width="1.5" opacity="0.7"/>
  <line x1="240" y1="210" x2="290" y2="210" stroke="#e643c8" stroke-width="1.5" opacity="0.7"/>
  <line x1="240" y1="235" x2="290" y2="235" stroke="#e643c8" stroke-width="1.5" opacity="0.7"/>
  <line x1="240" y1="260" x2="290" y2="260" stroke="#43e68d" stroke-width="1.5" opacity="0.7"/>
  <line x1="240" y1="285" x2="290" y2="285" stroke="#43e68d" stroke-width="1.5" opacity="0.7"/>
  <line x1="240" y1="310" x2="290" y2="310" stroke="#e643c8" stroke-width="1.5" opacity="0.7"/>
  <!-- Pin dots left -->
  <circle cx="30" cy="110" r="3" fill="#19e3e6"/><circle cx="30" cy="135" r="3" fill="#19e3e6"/><circle cx="30" cy="160" r="3" fill="#b47cff"/><circle cx="30" cy="185" r="3" fill="#b47cff"/><circle cx="30" cy="210" r="3" fill="#19e3e6"/><circle cx="30" cy="235" r="3" fill="#19e3e6"/><circle cx="30" cy="260" r="3" fill="#b47cff"/><circle cx="30" cy="285" r="3" fill="#b47cff"/><circle cx="30" cy="310" r="3" fill="#19e3e6"/>
  <!-- Pin dots right -->
  <circle cx="290" cy="110" r="3" fill="#e643c8"/><circle cx="290" cy="135" r="3" fill="#e643c8"/><circle cx="290" cy="160" r="3" fill="#43e68d"/><circle cx="290" cy="185" r="3" fill="#43e68d"/><circle cx="290" cy="210" r="3" fill="#e643c8"/><circle cx="290" cy="235" r="3" fill="#e643c8"/><circle cx="290" cy="260" r="3" fill="#43e68d"/><circle cx="290" cy="285" r="3" fill="#43e68d"/><circle cx="290" cy="310" r="3" fill="#e643c8"/>
  <!-- Pin bottom -->
  <line x1="100" y1="320" x2="100" y2="400" stroke="#b47cff" stroke-width="1.5" opacity="0.7"/>
  <line x1="130" y1="320" x2="130" y2="400" stroke="#19e3e6" stroke-width="1.5" opacity="0.7"/>
  <line x1="160" y1="320" x2="160" y2="400" stroke="#8A2BE2" stroke-width="1.5" opacity="0.7"/>
  <line x1="190" y1="320" x2="190" y2="400" stroke="#19e3e6" stroke-width="1.5" opacity="0.7"/>
  <line x1="220" y1="320" x2="220" y2="400" stroke="#b47cff" stroke-width="1.5" opacity="0.7"/>
  <circle cx="100" cy="400" r="3" fill="#b47cff"/><circle cx="130" cy="400" r="3" fill="#19e3e6"/><circle cx="160" cy="400" r="3" fill="#8A2BE2"/><circle cx="190" cy="400" r="3" fill="#19e3e6"/><circle cx="220" cy="400" r="3" fill="#b47cff"/>

  <!-- Animated pulse on chip core -->
  <circle cx="160" cy="207" r="55" fill="none" stroke="#8A2BE2" stroke-width="1" opacity="0">
    <animate attributeName="r" values="55;75;55" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="160" cy="207" r="55" fill="none" stroke="#19e3e6" stroke-width="0.5" opacity="0">
    <animate attributeName="r" values="40;65;40" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0;0.3" dur="3s" begin="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Corner marks -->
  <path d="M80 90 L93 90 M80 90 L80 103" stroke="#19e3e6" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M240 90 L227 90 M240 90 L240 103" stroke="#19e3e6" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M80 320 L93 320 M80 320 L80 307" stroke="#19e3e6" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M240 320 L227 320 M240 320 L240 307" stroke="#19e3e6" stroke-width="1.5" fill="none" opacity="0.6"/>

  <!-- Animated data flow left pin -->
  <circle cx="30" cy="110" r="2" fill="#19e3e6" opacity="0">
    <animate attributeName="cx" values="80;30;80" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="30" cy="185" r="2" fill="#b47cff" opacity="0">
    <animate attributeName="cx" values="30;80;30" dur="1.8s" begin="0.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="0.4s" repeatCount="indefinite"/>
  </circle>
</g>

<!-- ══════════ RIGHT: SKILL BARS ══════════ -->
<g transform="translate(320, 20)">
  <!-- Section header -->
  <text x="0" y="22" font-family="'JetBrains Mono',monospace" font-size="10" fill="#19e3e6" letter-spacing="3" opacity="0.7">sarshij@nepal:~$ cat skills.json</text>
  <line x1="0" y1="30" x2="560" y2="30" stroke="url(#accent)" stroke-width="1" opacity="0.5"/>

  <!-- LANGUAGES -->
  <text x="0" y="58" font-family="'JetBrains Mono',monospace" font-size="9" fill="#b47cff" letter-spacing="2">LANGUAGES</text>
  <text x="0" y="76" font-family="'JetBrains Mono',monospace" font-size="8" fill="#d9d4ee" opacity="0.6">Python · C/C++ · JavaScript · TypeScript · Bash</text>
  <!-- bar bg -->
  <rect x="0" y="82" width="560" height="8" rx="4" fill="#1a1530"/>
  <!-- bar fill animated -->
  <rect x="0" y="82" width="0" height="8" rx="4" fill="url(#bar1)">
    <animate attributeName="width" from="0" to="504" dur="1.4s" fill="freeze" begin="0.2s"/>
  </rect>
  <text x="512" y="90" font-family="'JetBrains Mono',monospace" font-size="8" fill="#b47cff">90%</text>

  <!-- WEB / FRONTEND -->
  <text x="0" y="114" font-family="'JetBrains Mono',monospace" font-size="9" fill="#19e3e6" letter-spacing="2">WEB · FRONTEND</text>
  <text x="0" y="132" font-family="'JetBrains Mono',monospace" font-size="8" fill="#d9d4ee" opacity="0.6">React · Next.js · Vite · Node · HTML/CSS</text>
  <rect x="0" y="138" width="560" height="8" rx="4" fill="#1a1530"/>
  <rect x="0" y="138" width="0" height="8" rx="4" fill="url(#bar2)">
    <animate attributeName="width" from="0" to="448" dur="1.4s" fill="freeze" begin="0.4s"/>
  </rect>
  <text x="456" y="146" font-family="'JetBrains Mono',monospace" font-size="8" fill="#19e3e6">80%</text>

  <!-- AI / ML -->
  <text x="0" y="170" font-family="'JetBrains Mono',monospace" font-size="9" fill="#e643c8" letter-spacing="2">AI · ML</text>
  <text x="0" y="188" font-family="'JetBrains Mono',monospace" font-size="8" fill="#d9d4ee" opacity="0.6">TensorFlow · PyTorch · OpenCV · MediaPipe · SBERT</text>
  <rect x="0" y="194" width="560" height="8" rx="4" fill="#1a1530"/>
  <rect x="0" y="194" width="0" height="8" rx="4" fill="url(#bar3)">
    <animate attributeName="width" from="0" to="420" dur="1.4s" fill="freeze" begin="0.6s"/>
  </rect>
  <text x="428" y="202" font-family="'JetBrains Mono',monospace" font-size="8" fill="#e643c8">75%</text>

  <!-- EMBEDDED -->
  <text x="0" y="226" font-family="'JetBrains Mono',monospace" font-size="9" fill="#43e68d" letter-spacing="2">EMBEDDED · HARDWARE</text>
  <text x="0" y="244" font-family="'JetBrains Mono',monospace" font-size="8" fill="#d9d4ee" opacity="0.6">Arduino · MCUs · PCB design · Circuit simulation</text>
  <rect x="0" y="250" width="560" height="8" rx="4" fill="#1a1530"/>
  <rect x="0" y="250" width="0" height="8" rx="4" fill="url(#bar4)">
    <animate attributeName="width" from="0" to="476" dur="1.4s" fill="freeze" begin="0.8s"/>
  </rect>
  <text x="484" y="258" font-family="'JetBrains Mono',monospace" font-size="8" fill="#43e68d">85%</text>

  <!-- SECURITY -->
  <text x="0" y="282" font-family="'JetBrains Mono',monospace" font-size="9" fill="#e6a543" letter-spacing="2">SECURITY · OS</text>
  <text x="0" y="300" font-family="'JetBrains Mono',monospace" font-size="8" fill="#d9d4ee" opacity="0.6">Linux · Kali · networking · automation · CTF</text>
  <rect x="0" y="306" width="560" height="8" rx="4" fill="#1a1530"/>
  <rect x="0" y="306" width="0" height="8" rx="4" fill="url(#bar5)">
    <animate attributeName="width" from="0" to="392" dur="1.4s" fill="freeze" begin="1.0s"/>
  </rect>
  <text x="400" y="314" font-family="'JetBrains Mono',monospace" font-size="8" fill="#e6a543">70%</text>

  <!-- DEVOPS / WORKFLOW -->
  <text x="0" y="338" font-family="'JetBrains Mono',monospace" font-size="9" fill="#43a8e6" letter-spacing="2">DEVOPS · WORKFLOW</text>
  <text x="0" y="356" font-family="'JetBrains Mono',monospace" font-size="8" fill="#d9d4ee" opacity="0.6">Git · GitHub Actions · Docker · VS Code · n8n</text>
  <rect x="0" y="362" width="560" height="8" rx="4" fill="#1a1530"/>
  <rect x="0" y="362" width="0" height="8" rx="4" fill="url(#bar6)">
    <animate attributeName="width" from="0" to="435" dur="1.4s" fill="freeze" begin="1.2s"/>
  </rect>
  <text x="443" y="370" font-family="'JetBrains Mono',monospace" font-size="8" fill="#43a8e6">78%</text>

  <!-- Bottom tag -->
  <text x="0" y="398" font-family="'JetBrains Mono',monospace" font-size="8" fill="#8A2BE2" opacity="0.5" letter-spacing="1">[ electronics engineer · AI · cybersecurity · Nepal ]</text>
</g>
</svg>
