    <stop offset="50%" stop-color="#8A2BE2" stop-opacity="0.08"/>
    <stop offset="100%" stop-color="#8A2BE2" stop-opacity="0"/>
  </linearGradient>
</defs>

<rect width="900" height="500" fill="url(#bg)" rx="16"/>
<rect width="900" height="500" fill="none" rx="16" stroke="#8A2BE2" stroke-width="1.5" opacity="0.5"/>

