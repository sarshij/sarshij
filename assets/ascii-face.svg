<path d="M20 480 L60 480 M20 480 L20 440" stroke="url(#g1)" stroke-width="2" fill="none"/>
<path d="M880 480 L840 480 M880 480 L880 440" stroke="url(#g1)" stroke-width="2" fill="none"/>

