  </linearGradient>
  <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#8A2BE2"/>
    <stop offset="50%" stop-color="#19e3e6"/>
    <stop offset="100%" stop-color="#e643c8"/>
