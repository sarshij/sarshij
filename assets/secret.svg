<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-label="Secret message">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0a0818"/>
    <stop offset="100%" stop-color="#0d0b16"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#8A2BE2"/>
    <stop offset="100%" stop-color="#19e3e6"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#8A2BE2" stop-opacity="0"/>
    <stop offset="50%" stop-color="#8A2BE2" stop-opacity="0.1"/>
    <stop offset="100%" stop-color="#8A2BE2" stop-opacity="0"/>
  </linearGradient>
</defs>

<rect width="900" height="220" fill="url(#bg)" rx="16"/>
<rect width="900" height="220" fill="none" rx="16" stroke="#8A2BE2" stroke-width="1" opacity="0.4"/>

<!-- Scanline -->
<rect x="16" y="0" width="868" height="50" fill="url(#scan)" rx="4">
  <animateTransform attributeName="transform" type="translate" from="0 -50" to="0 270" dur="4s" repeatCount="indefinite"/>
</rect>

<!-- Corner marks -->
<path d="M20 20 L45 20 M20 20 L20 45" stroke="#8A2BE2" stroke-width="1.5" fill="none" opacity="0.6"/>
<path d="M880 20 L855 20 M880 20 L880 45" stroke="#8A2BE2" stroke-width="1.5" fill="none" opacity="0.6"/>
<path d="M20 200 L45 200 M20 200 L20 175" stroke="#8A2BE2" stroke-width="1.5" fill="none" opacity="0.6"/>
<path d="M880 200 L855 200 M880 200 L880 175" stroke="#8A2BE2" stroke-width="1.5" fill="none" opacity="0.6"/>

<!-- Terminal prompt -->
<text x="40" y="45" font-family="'JetBrains Mono',monospace" font-size="9" fill="#19e3e6" opacity="0.6" letter-spacing="2">sarshij@nepal:~$ cat secret.txt</text>
<line x1="40" y1="54" x2="860" y2="54" stroke="url(#accent)" stroke-width="1" opacity="0.4"/>

<!-- Main message -->
<text x="450" y="102" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="16" fill="#b47cff" filter="url(#glow)" letter-spacing="1">If you scrolled this far —</text>
<text x="450" y="128" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="16" fill="#19e3e6" filter="url(#glow)" letter-spacing="1">you read READMEs for fun.</text>
<text x="450" y="158" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="13" fill="#d9d4ee" opacity="0.75">We'll get along just fine. 👾</text>

<!-- Blinking cursor at end -->
<rect x="668" y="143" width="9" height="14" rx="1" fill="#19e3e6">
  <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
</rect>

<!-- Bottom tag -->
<text x="450" y="196" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8" fill="#8A2BE2" opacity="0.4" letter-spacing="2">[ EOF · sys_core 0x8F2A · link active ]</text>
</svg>
