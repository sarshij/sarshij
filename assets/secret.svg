<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 195" width="900" height="195" role="img" aria-label="Secret note in ASCII format">
<defs>
  <linearGradient id="bd" x1="0" x2="1"><stop offset="0" stop-color="#8A2BE2"/><stop offset="1" stop-color="#19e3e6"/></linearGradient>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d0b16"/><stop offset="1" stop-color="#141029"/></linearGradient>
  <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8A2BE2" stop-opacity="0"/>
    <stop offset="50" stop-color="#8A2BE2" stop-opacity="0.12"/>
    <stop offset="100" stop-color="#8A2BE2" stop-opacity="0"/>
  </linearGradient>
  <filter id="gl"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="win"><rect width="900" height="195" rx="14"/></clipPath>
  <style>@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}} .cur{animation:blink 1s steps(1) infinite}</style>
</defs>
<g clip-path="url(#win)" font-family="'Fira Code','JetBrains Mono',Consolas,Menlo,'Courier New',monospace">
  <rect width="900" height="195" fill="url(#bg)"/>
  <rect x="0" y="0" width="900" height="42" fill="url(#scan)">
    <animateTransform attributeName="transform" type="translate" from="0 -42" to="0 237" dur="4.5s" repeatCount="indefinite"/>
  </rect>
  <text x="18" y="24" font-size="11" fill="#8A2BE2" opacity="0.75">+</text>
  <text x="882" y="24" text-anchor="end" font-size="11" fill="#8A2BE2" opacity="0.75">+</text>
  <text x="18" y="182" font-size="11" fill="#8A2BE2" opacity="0.75">+</text>
  <text x="882" y="182" text-anchor="end" font-size="11" fill="#8A2BE2" opacity="0.75">+</text>

  <g font-size="11.5"><text x="34.0" y="38.0" fill="#b47cff" textLength="47.6" lengthAdjust="spacing">sarshij</text><text x="81.6" y="38.0" fill="#7b7399" textLength="6.8" lengthAdjust="spacing">@</text><text x="88.4" y="38.0" fill="#19e3e6" textLength="34.0" lengthAdjust="spacing">nepal</text><text x="122.4" y="38.0" fill="#7b7399" textLength="27.2" lengthAdjust="spacing">:~$ </text><text x="149.6" y="38.0" fill="#e8e4f5" textLength="95.2" lengthAdjust="spacing">cat secret.txt</text></g>
  <text x="34" y="52" font-size="10.5" fill="#7b7399">------------------------------------------------------------------------------------------------------------------</text>

  <text x="450" y="88" text-anchor="middle" font-size="15.5" font-weight="700" fill="#b47cff" filter="url(#gl)">If you scrolled this far --</text>
  <text x="450" y="114" text-anchor="middle" font-size="15.5" font-weight="700" fill="#19e3e6" filter="url(#gl)">you read READMEs for fun.</text>
  <text x="348.6" y="142" font-size="13" fill="#e8e4f5" textLength="202.8" lengthAdjust="spacing">We'll get along just fine.</text>
  <rect class="cur" x="557.4" y="129" width="8" height="15" fill="#19e3e6"/>

  <text x="450" y="176" text-anchor="middle" font-size="9.5" fill="#7b7399" letter-spacing="1.5">[ EOF // sys_core 0x8F2A // link active ]</text>
</g>
<rect x=".75" y=".75" width="898.5" height="193.5" rx="14" fill="none" stroke="url(#bd)" stroke-width="1.5"/>
</svg>