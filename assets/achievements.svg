  <text x="44" y="26" font-family="'JetBrains Mono',monospace" font-size="9" fill="#43e68d" font-weight="bold" letter-spacing="1">PERFECT GPA</text>
  <text x="44" y="40" font-family="'JetBrains Mono',monospace" font-size="7.5" fill="#d9d4ee" opacity="0.7">Grade X · National Exam</text>
  <text x="14" y="62" font-family="'JetBrains Mono',monospace" font-size="22" fill="#43e68d" font-weight="bold" filter="url(#glow)">4.00</text>
  <text x="90" y="72" font-family="'JetBrains Mono',monospace" font-size="8" fill="#d9d4ee" opacity="0.6">/ 4.00 GPA</text>
  <text x="14" y="92" font-family="'JetBrains Mono',monospace" font-size="7" fill="#43e68d" opacity="0.8">[ flawless ]</text>
</g>

<!-- Card 5: Entrance exam -->
<g transform="translate(425, 185)" filter="url(#card-shadow)">
  <rect width="250" height="100" rx="10" fill="#12102a" stroke="#e6a543" stroke-width="1.2"/>
  <rect width="250" height="4" rx="2" fill="#e6a543" y="0"/>
  <text x="14" y="30" font-family="'JetBrains Mono',monospace" font-size="18" fill="#e6a543" filter="url(#glow)">⚡</text>
  <text x="44" y="26" font-family="'JetBrains Mono',monospace" font-size="9" fill="#e6a543" font-weight="bold" letter-spacing="1">CRACKED ENTRANCE</text>
  <text x="44" y="40" font-family="'JetBrains Mono',monospace" font-size="7.5" fill="#d9d4ee" opacity="0.7">Engineering Entrance Exam</text>
  <text x="14" y="62" font-family="'JetBrains Mono',monospace" font-size="9" fill="#d9d4ee" opacity="0.7">Cleared on the first attempt</text>
  <text x="14" y="77" font-family="'JetBrains Mono',monospace" font-size="7" fill="#e6a543" opacity="0.7">Competitive national examination</text>
  <text x="14" y="92" font-family="'JetBrains Mono',monospace" font-size="7" fill="#43e68d" opacity="0.8">[ first try ]</text>
</g>

<!-- Card 6: Cloud/Python training -->
<g transform="translate(705, 185)" filter="url(#card-shadow)">
  <rect width="145" height="100" rx="10" fill="#12102a" stroke="#43a8e6" stroke-width="1.2"/>
  <rect width="145" height="4" rx="2" fill="#43a8e6" y="0"/>
  <text x="14" y="26" font-family="'JetBrains Mono',monospace" font-size="9" fill="#43a8e6" font-weight="bold" letter-spacing="1">TRAININGS</text>
  <text x="14" y="46" font-family="'JetBrains Mono',monospace" font-size="7.5" fill="#d9d4ee" opacity="0.7">☁ Cloud Computing</text>
  <text x="14" y="62" font-family="'JetBrains Mono',monospace" font-size="7.5" fill="#d9d4ee" opacity="0.7">🐍 Python Programming</text>
  <text x="14" y="77" font-family="'JetBrains Mono',monospace" font-size="7" fill="#43a8e6" opacity="0.7">@ NCE</text>
  <text x="14" y="92" font-family="'JetBrains Mono',monospace" font-size="7" fill="#43e68d" opacity="0.8">[ certified ]</text>
