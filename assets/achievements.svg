  <rect width="250" height="4" rx="2" fill="#19e3e6" y="0"/>
  <text x="14" y="30" font-family="'JetBrains Mono',monospace" font-size="18" fill="#19e3e6" filter="url(#glow)">🎓</text>
  <text x="44" y="26" font-family="'JetBrains Mono',monospace" font-size="9" fill="#19e3e6" font-weight="bold" letter-spacing="1">FULL MERIT SCHOLARSHIP</text>
  <text x="44" y="40" font-family="'JetBrains Mono',monospace" font-size="7.5" fill="#d9d4ee" opacity="0.7">National College of Engineering</text>
  <text x="14" y="62" font-family="'JetBrains Mono',monospace" font-size="7" fill="#d9d4ee" opacity="0.6">100% tuition covered on academic merit</text>
  <text x="14" y="77" font-family="'JetBrains Mono',monospace" font-size="7" fill="#19e3e6" opacity="0.7">BEI Program · T.U. Affiliate</text>
  <text x="14" y="92" font-family="'JetBrains Mono',monospace" font-size="7" fill="#43e68d" opacity="0.8">[ merit-based ]</text>
</g>

<!-- Card 3: Liverpool scholarship -->
