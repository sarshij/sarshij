  <text x="14" y="30" font-family="'JetBrains Mono',monospace" font-size="18" fill="#e643c8" filter="url(#glow)">🌐</text>
  <text x="44" y="26" font-family="'JetBrains Mono',monospace" font-size="9" fill="#e643c8" font-weight="bold" letter-spacing="1">INT'L SCHOLARSHIP</text>
  <text x="44" y="40" font-family="'JetBrains Mono',monospace" font-size="7.5" fill="#d9d4ee" opacity="0.7">Liverpool International College</text>
  <text x="14" y="62" font-family="'JetBrains Mono',monospace" font-size="7" fill="#d9d4ee" opacity="0.6">Merit-based international recognition</text>
  <text x="14" y="77" font-family="'JetBrains Mono',monospace" font-size="7" fill="#e643c8" opacity="0.7">International Excellence Award</text>
  <text x="14" y="92" font-family="'JetBrains Mono',monospace" font-size="7" fill="#43e68d" opacity="0.8">[ merit-based ]</text>
</g>

<!-- Row 2 -->
