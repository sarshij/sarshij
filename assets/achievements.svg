<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="Sarshij Karn's achievements">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0d0b16"/>
    <stop offset="100%" stop-color="#0a0818"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#8A2BE2"/>
    <stop offset="100%" stop-color="#19e3e6"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="card-shadow">
    <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#8A2BE2" flood-opacity="0.3"/>
  </filter>
</defs>

<rect width="900" height="320" fill="url(#bg)" rx="16"/>
<rect width="900" height="320" fill="none" rx="16" stroke="#8A2BE2" stroke-width="1" opacity="0.4"/>

<!-- Header -->
<text x="450" y="34" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="10" fill="#19e3e6" letter-spacing="5" opacity="0.8">[ ./achievements.sh · UNLOCKED ]</text>
<line x1="40" y1="44" x2="860" y2="44" stroke="url(#accent)" stroke-width="1" opacity="0.5"/>

<!-- Achievement cards -->
<!-- Card 1: Hackathon -->
<g transform="translate(40, 60)" filter="url(#card-shadow)">
  <rect width="250" height="100" rx="10" fill="#12102a" stroke="#8A2BE2" stroke-width="1.2"/>
  <rect width="250" height="4" rx="2" fill="url(#accent)" y="0"/>
  <text x="14" y="30" font-family="'JetBrains Mono',monospace" font-size="18" fill="#b47cff" filter="url(#glow)">🏆</text>
  <text x="44" y="26" font-family="'JetBrains Mono',monospace" font-size="9" fill="#b47cff" font-weight="bold" letter-spacing="1">HACKATHON FINALIST</text>
  <text x="44" y="40" font-family="'JetBrains Mono',monospace" font-size="7.5" fill="#d9d4ee" opacity="0.7">Startup Hackathon 2025</text>
  <text x="14" y="62" font-family="'JetBrains Mono',monospace" font-size="7" fill="#d9d4ee" opacity="0.6">"AI for Social Impact &amp; Scale"</text>
  <text x="14" y="77" font-family="'JetBrains Mono',monospace" font-size="7" fill="#8A2BE2" opacity="0.7">The Startup Network · Embark · PHDCCI</text>
  <text x="14" y="92" font-family="'JetBrains Mono',monospace" font-size="7" fill="#43e68d" opacity="0.8">[ 2025 ]</text>
</g>

<!-- Card 2: NCE scholarship -->
<g transform="translate(320, 60)" filter="url(#card-shadow)">
